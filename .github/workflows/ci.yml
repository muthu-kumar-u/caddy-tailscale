name: Caddy starter checks and image
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.local.yml config --quiet
      - name: Validate server template
        env:
          CADDY_IMAGE: ghcr.io/crawlvero/caddy-tailscale-starter:verification
          APP_DOMAIN: app.example.com
          TLS_EMAIL: ops@example.com
          UPSTREAM: app:8000
        run: docker compose -f compose.server.yml config --quiet
      - run: shellcheck scripts/serve-private.sh
      - run: docker run --rm -e APP_DOMAIN=app.example.com -e TLS_EMAIL=ops@example.com -e UPSTREAM=app:8000 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.6-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: ${{ github.event_name == 'push' }}
      - name: Record image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published digest %s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
