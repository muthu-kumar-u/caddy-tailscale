services:
  edge:
    image: ${CADDY_IMAGE:-caddy-tailscale-starter:local}
    build: .
    ports: ['127.0.0.1:${LOCAL_PORT:-8088}:80']
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [demo]
  demo:
    image: caddy:2.11.6-alpine
    command: ['caddy', 'file-server', '--listen', ':8080', '--root', '/srv']
    volumes: [./demo:/srv:ro]
